<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Sleek Navy to Royal Blue -->
    <linearGradient id="pulseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Electric Cyan-to-Blue Pulse Gradient -->
    <linearGradient id="pulseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Inner Glow & Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with 116px radius -->
  <rect width="512" height="512" rx="116" fill="url(#pulseBg)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Bold Modern 'P' Letterform -->
  <!-- Stem -->
  <rect x="110" y="110" width="68" height="292" rx="34" fill="#ffffff" />
  
  <!-- Bowl of P -->
  <path d="M 144 110 H 276 C 346 110, 396 156, 396 226 C 396 296, 346 342, 276 342 H 144 Z" fill="#ffffff" />
  <!-- Bowl Inner Cutout -->
  <path d="M 178 172 H 268 C 304 172, 332 196, 332 226 C 332 256, 304 280, 268 280 H 178 Z" fill="#0f172a" />

  <!-- Electric Pulse Heartbeat Wave across bottom right -->
  <path d="M 178 356 L 240 356 L 262 310 L 290 412 L 326 268 L 358 376 L 380 356 L 420 356" fill="none" stroke="url(#pulseAccent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Pulsing Signal Dot -->
  <circle cx="420" cy="356" r="14" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="420" cy="356" r="7" fill="#ffffff" />
</svg>
